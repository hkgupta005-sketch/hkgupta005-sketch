<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 190" width="480" height="190" role="img" aria-label="hkgupta005-sketch GitHub stats"><title>hkgupta005-sketch GitHub stats</title><defs><style type="text/css"><![CDATA[
text{font-family:'Segoe UI',Arial,sans-serif}
@keyframes popIn{0%{opacity:0;transform:translateY(10px) scale(.85)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes dash{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:var(--off)}}
.pop{opacity:0;animation:popIn .5s ease forwards;transform-box:fill-box;transform-origin:center}
.fade{opacity:0;animation:fadeIn .6s ease forwards}
.ring{animation:dash 1.4s ease .3s forwards}
]]></style><linearGradient id="gg" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#F5B800"/><stop offset="100%" stop-color="#7C3AED"/></linearGradient></defs><rect width="480" height="190" rx="14" fill="#0B0910" stroke="url(#gg)" stroke-width="1.5"/><text x="24" y="34" font-size="16" font-weight="700" fill="#F5B800" class="fade" style="animation-delay:.05s">GITHUB STATS</text><line x1="24" y1="46" x2="330" y2="46" stroke="#2a2020" stroke-width="1"/><g class="fade" style="animation-delay:0.15s"><text x="24" y="68" font-size="12.5" fill="#E8E6EA">Public Repos</text><text x="310" y="68" font-size="14" font-weight="800" fill="#A78BFA" text-anchor="end">5</text></g><g class="fade" style="animation-delay:0.25s"><text x="24" y="95" font-size="12.5" fill="#E8E6EA">Total Stars</text><text x="310" y="95" font-size="14" font-weight="800" fill="#F5B800" text-anchor="end">0</text></g><g class="fade" style="animation-delay:0.35s"><text x="24" y="122" font-size="12.5" fill="#E8E6EA">Followers</text><text x="310" y="122" font-size="14" font-weight="800" fill="#A78BFA" text-anchor="end">0</text></g><g class="fade" style="animation-delay:0.45s"><text x="24" y="149" font-size="12.5" fill="#E8E6EA">Total Forks</text><text x="310" y="149" font-size="14" font-weight="800" fill="#F5B800" text-anchor="end">0</text></g><g class="pop" style="animation-delay:.4s"><circle cx="402" cy="105" r="46" fill="none" stroke="#231b30" stroke-width="7"/><circle class="ring" style="--len:289.0;--off:271.0" cx="402" cy="105" r="46" fill="none" stroke="url(#gg)" stroke-width="7" stroke-linecap="round" stroke-dasharray="289.0" stroke-dashoffset="289.0" transform="rotate(-90 402 105)"/><text x="402" y="117" font-size="30" font-weight="800" fill="#F5B800" text-anchor="middle">C</text><text x="402" y="145" font-size="10" fill="#8b8690" text-anchor="middle" letter-spacing="1.5">RANK</text></g><text x="24" y="174" font-size="10" fill="#8b8690" class="fade" style="animation-delay:.9s">Live data &#8226; 